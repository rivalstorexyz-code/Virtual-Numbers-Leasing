<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:defaultwidgetversion='2' b:layoutsVersion='3' b:responsive='true' dir='rtl' lang='ar' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
  <meta content='width=device-width, initial-scale=1' name='viewport'/>
  <b:include data='blog' name='all-head-content'/>
  <title><data:view.title.escaped/></title>
  <b:skin version='1.3.3'><![CDATA[
    body { margin:0; background:#f5f1e9; color:#092b57; font-family:Tahoma, Arial, sans-serif; }
    .site-header { background:#09264c; border-bottom:2px solid #d3ad52; }
    .site-header-inner { max-width:1100px; margin:auto; padding:8px clamp(14px,4vw,36px); }
    .site-brand { display:inline-flex; align-items:center; gap:9px; color:white; text-decoration:none; font-weight:bold; font-size:clamp(17px,4vw,24px); }
    .site-brand img { width:clamp(48px,8vw,68px); height:auto; }
    .site-main { padding:0 clamp(12px,4vw,28px); }

    #wamdat-join { --navy:#092b57; --gold:#e8cc89; color:var(--navy); max-width:48rem; margin:24px auto; direction:rtl; }
    #wamdat-join, #wamdat-join * { box-sizing:border-box; }
    #wamdat-join .join-banner { background:var(--navy); color:white; padding:clamp(18px,5vw,36px); border-radius:16px 16px 0 0; }
    #wamdat-join h1 { color:var(--gold); margin:0 0 16px; font-size:clamp(30px,6vw,48px); line-height:1.2; }
    #wamdat-join .join-invite { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    #wamdat-join .join-invite p { margin:0; line-height:1.6; }
    #wamdat-join .join-button { display:inline-flex; justify-content:center; align-items:center; gap:7px; min-height:44px; padding:0 14px; border:0; border-radius:8px; background:var(--gold); color:var(--navy); font:inherit; font-weight:bold; cursor:pointer; white-space:nowrap; text-decoration:none; }
    #wamdat-join .join-button svg { width:20px; height:20px; }
    #wamdat-join .join-fields { display:grid; gap:12px; padding:clamp(18px,5vw,36px); background:#f5f1e9; border:1px solid var(--gold); border-top:0; border-radius:0 0 16px 16px; }
    #wamdat-join h2 { margin:0 0 6px; font-size:1.15rem; color:var(--navy); }
    #wamdat-join :focus-visible { outline:2px solid #17689a; outline-offset:3px; }
    #wamdat-join .join-share-status:not(:empty) { margin:8px 0 0; color:var(--gold); }
    #wamdat-join .join-library { color:var(--navy); width:fit-content; margin-top:6px; }
  ]]></b:skin>
</head>
<body>
  <header class='site-header'>
    <div class='site-header-inner'>
      <a class='site-brand' expr:href='data:blog.homepageUrl'>
        <img alt='' height='256' src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQAAAAEACAYAAABccqhmAABaz0lEQVR42u29eZhcV3UtvvY+t6q7JWuwLYFtbGNwwOARYyZjwHaAQAIhA5FCCEMSHgHyQsIvISQk5Ekij5eXgSSQl0cgzPgxqDMwBohJJDOFEBljsI0xg4kBD8hIlqXurrrn7L1/f9xzq07dqh7Vkrrls7+vP5Vara5bVXevs8e1gGzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmXLli1btmzZsmU70vb/A4AeN/V8+M5LAAAAAElFTkSuQmCC' width='256'/>
        <span>ومضات بو محمد</span>
      </a>
    </div>
  </header>
  <main class='site-main'>
    <section aria-labelledby='wamdat-join-title' dir='rtl' id='wamdat-join'>
      <header class='join-banner'>
        <h1 id='wamdat-join-title'>إشترك</h1>
        <div class='join-invite'>
          <p>لدعوة مشتركين جدد&#1548; شاركهم هذه الصفحة.</p>
          <button class='join-button' id='wamdat-share-page' type='button'>
            <svg aria-hidden='true' fill='none' stroke='currentColor' stroke-width='2' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'><circle cx='6' cy='12' r='2'/><circle cx='18' cy='5' r='2'/><circle cx='18' cy='19' r='2'/><path d='m8 11 8-5m-8 7 8 5'/></svg>
            مشاركة
          </button>
        </div>
        <p class='join-share-status' id='wamdat-share-status' role='status'></p>
      </header>
      <div aria-labelledby='wamdat-fields-title' class='join-fields'>
        <h2 id='wamdat-fields-title'>للاشتراك&#1548; املأ النموذج التالي</h2>
        <iframe src='https://docs.google.com/forms/d/e/1FAIpQLScQn3XBU9zpfcNNZpmvkHja7c6Om_XnjawfrRFigpPme4gung/viewform?embedded=true' style='width:100%;height:770px;border:0;display:block;' title='نموذج الانضمام إلى مكتبة ومضات'></iframe>
        <a class='join-library' href='https://docs.google.com/forms/d/e/1FAIpQLScQn3XBU9zpfcNNZpmvkHja7c6Om_XnjawfrRFigpPme4gung/viewform' rel='noopener' target='_blank'>فتح النموذج في صفحة مستقلة</a>
        <a class='join-library' href='https://www.wamadat-abumohammed.com/'>مكتبة ومضات أبو محمد الرقمية</a>
      </div>
    </section>
  </main>
  <b:section class='main' id='main' name='المحتوى الرئيسي' showaddelement='no'/>
  <script><![CDATA[
(() => {
  const button = document.getElementById('wamdat-share-page');
  const status = document.getElementById('wamdat-share-status');
  if (!button || !status) return;
  button.addEventListener('click', async () => {
    const url = document.querySelector('link[rel="canonical"]')?.href || location.href.split('#')[0];
    status.textContent = '';
    if (navigator.share) {
      try {
        await navigator.share({
          title: 'الاشتراك في مكتبة ومضات',
          text: 'للاشتراك في مكتبة ومضات أبو محمد الرقمية:',
          url
        });
        return;
      } catch (error) {
        if (error.name === 'AbortError') return;
      }
    }
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = 'تم نسخ رابط الصفحة — يمكنك لصقه ومشاركته في أي تطبيق.';
    } catch {
      status.textContent = 'رابط الصفحة: ' + url;
    }
  });
})();
  ]]></script>
</body>
</html>
